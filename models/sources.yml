version: 2

sources:
  - name: jaffle_shop
    database: raw  
    freshness: # default freshness
      warn_after: {count: 12, period: hour}
      error_after: {count: 24, period: hour}
    schema: jaffle_shop  
    tables:
      - name: orders
        columns:
         - name: id
           description: Primary key of the orders table
           tests:
            - unique
            - not_null
         - name: status
           description: Note that the status can change over time

      - name: customers


  - name: stripe
    tables:
      - name: payments