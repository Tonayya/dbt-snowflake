version: 2

models:
  - name: secondary_sales_validation
    description: "Secondary model - Used to validate against priority model"
    config:
      tags: ["secondary"]
    columns:
      - name: region
        description: "Geographic region"
        tests:
          - not_null
          - unique
      - name: total_revenue
        description: "Total revenue for the region"

    tests:
      # THIS IS THE PROBLEMATIC TEST
      # It tries to compare this secondary model against the priority model
      # But when running in the secondary job, the priority model isn't in the DAG
      - dbt_expectations.expect_table_aggregation_to_equal_other_table:
          arguments:
            expression: sum(total_revenue)
            compare_model: ref('priority_sales_summary')
            tags: ["secondary", "cross_job_test"]

      # Additional test to show the issue
      - dbt_expectations.expect_table_aggregation_to_equal_other_table:
          arguments:
            expression: count(*)
            compare_model: ref('priority_sales_summary')
            group_by: [region]
            tags: ["secondary", "cross_job_test"]
