version: 2

models:
  - name: priority_sales_summary
    description: "Priority model - Regional sales summary that runs in the priority job"
    config:
      tags: ['priority']
    columns:
      - name: region
        description: "Geographic region"
        tests:
          - not_null
          - unique
      - name: total_orders
        description: "Total number of orders"
      - name: total_revenue
        description: "Total revenue for the region"